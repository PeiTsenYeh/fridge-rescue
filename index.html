function chip(name,set,update){let b=document.createElement('button');b.className='chip';b.textContent=name;b.setAttribute('aria-pressed',set.has(name));b.onclick=()=>{set.has(name)?set.delete(name):set.add(name);save();update()};return b}
function missing(r){return r.items.filter(i=>!chosen.has(i.name))}
function render(){let limit=Number($('time').value);let pool=recipes.filter(r=>r.time<=limit);visible=view==='favorites'?pool.filter(r=>favorites.has(r.id)):pool.filter(r=>equipment.has(r.gear)&&missing(r).length<=1);visible.sort((a,b)=>missing(a).length-missing(b).length||a.time-b.time);$('favCount').textContent=favorites.size;$('all').classList.toggle('active',view==='all');$('favorites').classList.toggle('active',view==='favorites');let ready=visible.filter(r=>missing(r).length===0&&equipment.has(r.gear)).length;$('summary').textContent=view==='favorites'?'收藏會保存在目前瀏覽器；每道食譜仍會標出缺少的材料與設備。':`已選 ${chosen.size} 種材料 · ${ready} 道可以開煮 · ${visible.length-ready} 道再補一項。配對不核對庫存重量，開煮前請確認一人份用量。`;$('cards').replaceChildren();if(!visible.length){$('cards').innerHTML=`<div class="empty"><div style="font-size:45px">${view==='favorites'?'♡':'🥣'}</div><strong>${view==='favorites'?'你的口袋食譜，等你收藏':'一頓好飯，從幾樣食材開始'}</strong><br>${view==='favorites'?'點餐點右上角的愛心，就能留到下次。':'勾選食材、調味料與設備，或按左側的「先試試」。'}<br><small>目前收錄 ${recipes.length} 道一人份食譜，可調整時間篩選查看更多。</small></div>`;return}for(const r of visible){let miss=missing(r),gearMissing=!equipment.has(r.gear);let status=gearMissing?'需要'+r.gear:miss.length?'還差 '+miss.map(i=>i.name).join('、'):'✓ 食材齊全，可以開煮';let card=document.createElement('article');card.className='card';card.innerHTML=`<div class="food"><span aria-hidden="true">${r.icon}</span><button class="heart" aria-label="${favorites.has(r.id)?'取消收藏':'收藏'}${r.name}" aria-pressed="${favorites.has(r.id)}">${favorites.has(r.id)?'♥':'♡'}</button></div><div class="body"><span class="badge ${miss.length||gearMissing?'missing':''}">${status}</span><h3>${r.name}</h3><div class="meta">◷ ${r.time} 分鐘　·　${r.gear}　·　1 人份</div><p class="ingredients">${r.items.map(i=>i.name).join(' · ')}</p><button class="details">看看怎麼做 ↗</button></div>`;card.querySelector('.heart').onclick=()=>{favorites.has(r.id)?favorites.delete(r.id):favorites.add(r.id);save();render()};card.querySelector('.details').onclick=()=>openRecipe(r);$('cards').append(card)}}
function openRecipe(r){let miss=missing(r);$('detailBody').innerHTML=`<h2 id="detailTitle">${r.icon} ${r.name}</h2><p class="meta">1 人份 · 約 ${r.time} 分鐘 · ${r.gear}</p>${miss.length||!equipment.has(r.gear)?`<p class="notice">${miss.length?'缺少材料：'+miss.map(i=>i.name).join('、')+'。 ':''}${!equipment.has(r.gear)?'需要設備：'+r.gear+'。':''}備妥後再開始料理。</p>`:''}<h3>準備這些就好</h3><table>${r.items.map(i=>`<tr><td>${chosen.has(i.name)?'✓':'○'} ${i.name}</td><td>${i.amount}</td></tr>`).join('')}</table><h3>一步一步，開飯了</h3>${r.steps.map((s,i)=>`<label class="step"><input type="checkbox"> <strong>${i+1}.</strong> ${s}</label>`).join('')}<p class="notice">飲用水依步驟備妥。食材份量可依食量調整；請核對過敏原、保存狀況，並將食物充分加熱。料理時間為估計值。</p>`;$('detail').showModal();$('detail').scrollTop=0}
$('search').oninput=chips;$('time').onchange=render;$('all').onclick=()=>{view='all';render()};$('favorites').onclick=()=>{view='favorites';render()};$('clear').onclick=()=>{chosen.clear();$('search').value='';save();chips();render()};$('sample').onclick=()=>{chosen=new Set(['白飯','雞蛋','高麗菜','油','鹽','醬油']);equipment=new Set(['平底鍋','湯鍋','免開火']);$('search').value='';$('time').value='99';view='all';save();chips();render()};$('rescue').onclick=()=>{view='all';render();$('resultTitle').scrollIntoView({behavior:'smooth',block:'start'})};$('random').onclick=()=>{let ready=visible.filter(r=>!missing(r).length&&equipment.has(r.gear));if(ready.length)openRecipe(ready[Math.floor(Math.random()*ready.length)]);else $('summary').textContent='還沒有材料與設備齊全的餐點。請先補齊食材，或調整料理時間。'};$('close').onclick=()=>$('detail').close();$('detail').onclick=e=>{if(e.target===$('detail')){let b=$('detail').getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)$('detail').close()}};chips();render();
</script></html>
